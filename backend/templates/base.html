<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agnus Dei{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/mais-sobre.css">
    <link rel="stylesheet" href="/static/css/home.css">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}" sizes="32x32">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}" sizes="16x16">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon.png') }}" sizes="180x180">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    
    
    


</head>
<body>
    <header>
        
    </header>

    <main>
        <nav class="navegacao">
            <a href="/home">
                <img src="{{ url_for('static', filename='img/imagemLogo.png') }}" alt="Logo do Site">
            </a>
            <button class="menu-toggle" aria-label="Abrir menu">&#9776; Menu</button>
            <ul class="menu">
                <li><a href="/home">Pagina Principal</a></li>
                <li><a href="/personagens">Mais Sobre</a></li>
                <li><a href="/oracoes">Orações</a></li>
                <li><a href="/artigo">Artigos</a></li>
                <li><a href="/contato">Contato</a></li>
            </ul>
        </nav>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Agnus Dei. Todos os direitos reservados. Criado com amor a Deus por: Felipe Salviano</p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
</body>
</html>
