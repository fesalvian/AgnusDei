{% block title %}{{ artigo.titulo }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/css/autora.css">

  <p><em>Leitura estimada: {{ artigo.tempo_estimado_leitura }} min</em></p>

{% endblock %}
