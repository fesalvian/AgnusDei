{% extends "base.html" %}

{% block title %}Artigos{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/artigos.css') }}">


<main class="container">
    <!-- Filtros de Categoria -->
    <div class="filtros">
        <button class="filtro-btn active" data-categoria="todos">Todos</button>
        <button class="filtro-btn" data-categoria="tradicoes">Tradições</button>
        <button class="filtro-btn" data-categoria="estudos">Estudos Bíblicos</button>
        <button class="filtro-btn" data-categoria="reflexoes">Reflexões</button>
    </div>

    <div class="artigos-container" id="artigos-container">
        <div id="loading-animation" class="dot-wave">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="shadow"></div>
            <div class="shadow"></div>
            <div class="shadow"></div>
        </div>
    </div>
</div>  

<!-- Modal Article -->
<div id="article-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <div id="modal-loading" class="dot-wave">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <div id="modal-content" style="display:none;">
        <h2 id="modal-title"></h2>
        <img id="modal-image" src="" alt="" class="modal-image">
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
  </div>
</main>

<script src="{{ url_for('static', filename='js/artigos.js') }}"></script>
{% endblock %}
